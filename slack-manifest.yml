display_information:
  name: Escalation Router
  description: Tells support which engineering team owns a bug, and who is on call.
features:
  bot_user:
    display_name: router
    always_online: true
  shortcuts:
    - name: Escalate this
      type: message
      callback_id: escalate_message
      description: Find the team that owns this bug
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
